name: Build & Release VSIX

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to create a GitHub Release for (manual builds only; tag pushes release automatically)'
        required: false
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: darwin-arm64
          - os: ubuntu-22.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-2022
            target: win32-x64
          # darwin-x64 / win32-arm64: GitHub has no hosted Intel macOS or
          # Windows ARM runners anymore. To build them, add entries pointing
          # at self-hosted runners with those architectures.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual releases must build the requested tag, not the current branch.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref }}
          # Build dependencies do not need access to the repository token.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package VSIX
        run: npm run package
        env:
          # Exercise the bundled runtime, migration and two-backend sharing on
          # each OS/architecture; no real model credentials are used.
          DSH_RUNTIME_SMOKE: '1'

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Tag pushes create a GitHub Release automatically; manual dispatch does so only when a
    # tag name is supplied, so `github.ref` (a branch) never creates a release.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # The release notes are extracted from CHANGELOG.md, so the repository
      # must be checked out (the build artifacts arrive via download-artifact).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag_name }}
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: vsix-*
          merge-multiple: true

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          tag="${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}"
          section="${tag#v}"
          # Note: 'in' is a reserved word in awk, so the section flag uses 'on'.
          awk -v sec="## ${section}" '$0==sec{on=1;next} on&&/^## /{exit} on{print}' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG section found for ${section}" >&2
            exit 1
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
          files: artifacts/**/*.vsix
          body_path: RELEASE_NOTES.md
